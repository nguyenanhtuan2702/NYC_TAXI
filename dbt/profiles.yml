nyc_taxi_dw:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'taxi_user') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', '123456') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'nyc_taxi_staging') }}"
      schema: dds
      threads: 4
